<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kyoto rendering benchmark</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/",
          "three-mesh-bvh": "/vendor/bvh/src/index.js"
        }
      }
    </script>
    <style>
      body {
        background: #101724;
        color: #f2e9d1;
        font: 14px system-ui;
        margin: 16px;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      button {
        padding: 10px 18px;
        margin: 8px 12px 8px 0;
      }
      pre {
        white-space: pre-wrap;
      }
      #status {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Kyoto rendering benchmark</h1>
    <p>
      Identical 1280 × 720 drawing buffer, every triangle and original texture
      resolution, fixed lighting and four camera routes. No adaptive resolution.
    </p>
    <button id="run" disabled>Run benchmark</button
    ><span id="status">Loading…</span
    ><canvas id="game" width="1280" height="720"></canvas>
    <fieldset id="inspection" hidden><legend>Station inspection</legend>
      <label>View <select id="station-view"></select></label>
      <button id="save-view">Save view</button><button id="save-views">Save all views</button><button id="evening" aria-pressed="false">Evening lights</button>
      <label>Position <input id="view-position" aria-label="Camera position" size="28"></label>
      <label>Target <input id="view-target" aria-label="Camera target" size="28"></label><button id="apply-view">Apply camera</button>
      <p id="view-evidence"></p>
    </fieldset>
    <pre id="result"></pre>
    <script type="module" src="/bench/render.js"></script>
  </body>
</html>
