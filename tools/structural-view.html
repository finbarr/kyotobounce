import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createEscalators}from'/web/public/escalators.js';
const q=new URLSearchParams(location.search),scene=new THREE.Scene();scene.background=new THREE.Color(0x9aaebc);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.localClippingEnabled=true;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.02,700),controls=new OrbitControls(camera,renderer.domElement);camera.position.fromArray((q.get('eye')||'28,4,-1').split(',').map(Number));controls.target.fromArray((q.get('at')||'19,0,-7').split(',').map(Number));controls.update();scene.add(new THREE.HemisphereLight(0xcfe8ff,0x726d58,3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(20,80,20);scene.add(light);

</script></body></html>
